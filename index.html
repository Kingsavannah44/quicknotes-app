<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p class="tagline">Capture your thoughts, instantly.</p>
    </header>

    <main>
      <section class="section-add">
        <h2>Add a Note</h2>
        <form id="note-form">
          <label for="note-input">Note</label>
          <input
            type="text"
            id="note-input"
            placeholder="Type your note here..."
            autocomplete="off"
          />
          <label for="note-category">Category</label>
          <select id="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
          <button type="submit">Add Note</button>
        </form>
        <p id="error-message" aria-live="polite"></p>
      </section>

      <section class="section-notes">
        <h2>Your Notes</h2>
        <input
          type="search"
          id="search-input"
          placeholder="Search notes..."
          autocomplete="off"
          aria-label="Search notes"
        />
        <p id="note-count">You have no notes yet.</p>
        <ul id="notes-list" aria-live="polite"></ul>
        <button id="clear-all-btn" aria-label="Clear all notes">Clear All Notes</button>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes &mdash; Keep it simple.</p>
    </footer>
  </body>
</html>
